name: Github Proxy CI/CD

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main", "stage" ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - name: Upload jar
        uses: actions/upload-artifact@v7
        with:
          name: app-jar
          path: target/github-proxy-0.0.1-SNAPSHOT.jar

  sonar:
    name: SonarQube Cloud
    needs: build-test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: SonarCloud analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: >
          mvn -B verify org.sonarsource.scanner.maven:sonar-maven-plugin:sonar
          -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
          -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
          -Dsonar.host.url=https://sonarcloud.io

  dependency-scan:
    name: Repository security scan
    needs: build-test
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Trivy repository scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-repository-report.json
          exit-code: "1"

      - name: Upload repository report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repository-security-report
          path: trivy-repository-report.json
          if-no-files-found: ignore
          retention-days: 14

  docker:
    name: Docker security and publishing
    needs: [build-test, sonar, dependency-scan]
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download application JAR
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: target/

      - name: Set image name
        run: |
          echo "IMAGE_NAME=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Build Docker image
        run: |
          docker build \
            --tag "$IMAGE_NAME:$GITHUB_SHA" \
            --tag "$IMAGE_NAME:latest" .

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: json
          output: trivy-image-report.json
          exit-code: "1"

      - name: Generate SBOM
        if: success()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: "0"

      - name: Upload image reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: image-reports
          path: |
            trivy-image-report.json
            sbom.cdx.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Login to GHCR
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')
        run: |
          docker push "$IMAGE_NAME:$GITHUB_SHA"
          docker push "$IMAGE_NAME:latest"

      - name: Install Cosign
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')
        uses: sigstore/cosign-installer@v3

      - name: Sign Docker image
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/stage')
        run: |
          IMAGE_REF=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE_NAME:$GITHUB_SHA")
          cosign sign --yes "$IMAGE_REF"

  publish-artifact:
    name: Artifact repository demo
    needs: [build-test, sonar, dependency-scan, docker]
    runs-on: ubuntu-24.04

    steps:
      - name: Download application JAR
        uses: actions/download-artifact@v7
        with:
          name: app-jar
          path: artifacts/

      - name: Simulate artifact upload
        run: |
          echo "Simulating upload to Nexus Repository or Artifactory"
          sha256sum artifacts/github-proxy-0.0.1-SNAPSHOT.jar
          echo "Upload finished (simulated)"

      - name: Upload demo artifact
        uses: actions/upload-artifact@v7
        with:
          name: central-repository-demo
          path: artifacts/github-proxy-0.0.1-SNAPSHOT.jar
          retention-days: 14