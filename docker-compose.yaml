version: '3'
services:
  gh-proxy:
    container_name: gh-proxy
    build:
      context: .
    image: gh-proxy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/githubproxy
      - LOGSTASH_HOST=logstash
    ports:
      - "8080:8080"
    networks:
      - default
      - elk-network
    depends_on:
      - db
      - keycloak

  db:
    image: postgres
    container_name: gh-proxy-db
    environment:
      - POSTGRES_DB=githubproxy
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - local_pgdata:/var/lib/postgresql

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin4
    environment:
      - PGADMIN_DEFAULT_EMAIL=demo@example.com
      - PGADMIN_DEFAULT_PASSWORD=secret
    ports:
      - "8888:80"
    depends_on:
      - db
    volumes:
      - pgadmin-data:/var/lib/pgadmin

  keycloak-db:
    image: postgres
    container_name: keycloak-db
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=keycloak
      - POSTGRES_PASSWORD=pass
    volumes:
      - keycloak_pgdata:/var/lib/postgresql
    networks:
      - default

  keycloak:
    image: quay.io/keycloak/keycloak:25.0
    container_name: keycloak
    command: start-dev
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: pass
      KC_HTTP_PORT: 8180
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8180:8180"
    depends_on:
      - keycloak-db
    networks:
      - default

volumes:
  local_pgdata:
  pgadmin-data:
  keycloak_pgdata:

networks:
  default:
  elk-network:
    external: true