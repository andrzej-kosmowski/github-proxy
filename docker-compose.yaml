version: '3'
services:
  gh-proxy:
    container_name: gh-proxy
    build:
      context: .
    image: gh-proxy
    ports:
      - "8080:8080"
    depends_on:
      - db

  db:
    image: postgres
    container_name: gh-proxy-db
    environment:
      - POSTGRES_DB=githubproxy
      - POSTGRES_USER=sa
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"



