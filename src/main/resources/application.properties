spring.application.name=github-proxy
app.githubClient.url=https://api.github.com/repos
spring.datasource.url=jdbc:postgresql://localhost:5432/githubproxy
spring.datasource.driverClassName=org.postgresql.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=validate
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.cloud.openfeign.circuitbreaker.enabled=true
logging.level.root=INFO
logging.level.com.github_proxy=DEBUG
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/github-proxy-app
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://keycloak:8180/realms/github-proxy-app/protocol/openid-connect/certs
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.oauth2=DEBUG